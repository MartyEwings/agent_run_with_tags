name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate & unit tests (Puppet ${{ matrix.puppet }}, Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - puppet: '8'
            ruby: '3.2'
          - puppet: '9'
            ruby: '4.0'
    env:
      # Puppet 8.11+ and 9 gems are published only to the authenticated
      # puppetcore gem source. PUPPET_FORGE_TOKEN is a Forge API key stored as
      # a repository secret (not available to PRs from forks).
      PUPPET_FORGE_TOKEN: ${{ secrets.PUPPET_FORGE_TOKEN }}
      BUNDLE_RUBYGEMS___PUPPETCORE__PUPPET__COM: forge-key:${{ secrets.PUPPET_FORGE_TOKEN }}
      PUPPET_GEM_VERSION: '~> ${{ matrix.puppet }}.0'
      BUNDLE_WITHOUT: system_tests:release_prep
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Validate
        run: bundle exec rake validate rubocop tasknames

      - name: Validate task metadata
        run: bundle exec ruby -rjson -e 'Dir["tasks/*.json"].each { |f| JSON.parse(File.read(f)) }'

      - name: Unit tests
        run: bundle exec rake spec

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Scans the repository for shell scripts and lints any it finds. The task
      # is currently pure Ruby, so this is a no-op today but guards any shell
      # scripts added in future.
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
